[build-system]
requires = [
    "scikit-build-core>=0.10",
    "cython-cmake>=0.2",
    "Cython>=0.24",
    "scipy>=0.16",
    "ninja>=1.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "pm-implicit"
version = "0.7.3"
description = "Collaborative Filtering for Implicit Feedback Datasets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Aki Ariga", email = "chezou@gmail.com"}
]
keywords = [
    "Matrix Factorization",
    "Implicit Alternating Least Squares",
    "Collaborative Filtering",
    "Recommender Systems"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Cython",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.17.0",
    "scipy>=0.16",
    "tqdm>=4.27",
    "threadpoolctl"
]

[project.urls]
Homepage = "http://github.com/chezou/pm-implicit/"
Repository = "http://github.com/chezou/pm-implicit/"

[tool.scikit-build]
cmake.version = ">=3.21"
cmake.build-type = "Release"
wheel.packages = ["implicit"]
wheel.exclude = [
    "**/thrust/**",
    "**/spdlog/**",
    "**/rmm/**",
    "**/lib/**",
    "**/include/**",
]
minimum-version = "0.10"

[tool.ruff]
line-length = 100
extend-exclude = ["examples/tutorial_lastfm.ipynb"]

[tool.ruff.lint]
# Enables: pycodestyle errors/warnings, pyflakes, isort, pyupgrade
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["implicit"]
lines-after-imports = 2

[tool.ruff.format]
# Use double quotes, 4-space indentation, preserve trailing commas
quote-style = "double"
indent-style = "space"

[tool.codespell]
skip = "./.git,./.github,./build,./dist,./docs/build,.*egg-info.*,*.csv,*.tsv"
ignore-words-list = "als,coo,nd,unparseable,compiletime"

[tool.cibuildwheel]
# skip testing in the cibuildwheel phase, will install the wheels later
# and verify
test-command = ""
skip = ["*musl*",  "*-manylinux_i686", "*win32"]

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_x86_64*"
before-all = "ci/install_cuda.sh"

# auditwheel: exclude CUDA libraries only (RMM/rapids_logger statically linked)
[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair --exclude libcublas.so.12 --exclude libcurand.so.10 --exclude libcublasLt.so.12 --exclude libcudart.so.12 -w {dest_dir} {wheel}"
# Use manylinux_2_28 (AlmaLinux 8) for CUDA 12.9 support
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.linux.environment]
CUDACXX = "/usr/local/cuda/bin/nvcc"

# Build `universal2` and `arm64` wheels on an Intel runner.
# Note that the `arm64` wheel and the `arm64` part of the `universal2`
# wheel cannot be tested in this configuration.
[tool.cibuildwheel.macos]
archs = ["x86_64", "universal2", "arm64"]

[tool.pytest.ini_options]
filterwarnings = ['ignore::implicit.utils.ParameterWarning']

[tool.bumpversion]
current_version = "0.7.3"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "implicit/__init__.py"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
